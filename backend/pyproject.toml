[project]
name = "scry-x-ai-backend"
version = "0.1.0"
description = "Backend foundation for Scry-X-AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pyjwt>=2.10,<3",
  "bcrypt>=4.3,<5",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
